    <!--
      Preloader estático: pinta o fundo e a linha de carregamento antes do JS chegar (em 3G a tela ficava vazia por
      uns 9 s). Mesma posição e texto da linha do Preloader.tsx, que o remove ao montar. As cores vêm de tokens.css
      (CSS embutido no build); o valor depois da vírgula só vale no dev, antes do CSS chegar.
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 10000;
        background: var(--c-bg, #0b0f0c);
      }
      #boot p {
        position: absolute;
        left: 0;
        right: 0;
        bottom: calc(env(safe-area-inset-bottom) + 24px);
        margin: 0;
        text-align: center;
        font-family: 'Commit Mono', ui-monospace, monospace;
        font-size: 11px;
        line-height: 1.5;
        color: var(--c-muted, #a9afa3);
      }
      @media (min-width: 768px) {
        #boot p {
          font-size: 12px;
          line-height: 16px;
        }
      }
    </style>
    <noscript><style>#boot { display: none; }</style></noscript>

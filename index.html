    <!--
      Preloader estático: pinta o fundo e o cursor piscando antes do JS chegar (em 3G a tela ficava vazia por uns 9 s).
      Mesma caixa, fonte e posição do cursor do Preloader.tsx, que o remove ao montar. As cores vêm de tokens.css
      (CSS embutido no build); o valor depois da vírgula só vale no dev, antes do CSS chegar.
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--c-bg, #0b0f0c);
      }
      #boot .box {
        position: relative;
        font-family: 'Tanker', 'Arial Narrow', sans-serif;
        font-size: min(15vw, 26svh);
        line-height: 1;
        white-space: pre;
        text-transform: uppercase;
      }
      #boot .ghost {
        visibility: hidden;
      }
      #boot .line {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
      }
      #boot .caret {
        display: inline-block;
        margin-left: 0.04em;
        width: 3px;
        height: 0.78em;
        background: var(--c-acid, #c6f24e);
        animation: boot-blink 1s steps(1) infinite;
      }
      @media (min-width: 768px) {
        #boot .caret {
          width: 4px;
        }
      }
      @keyframes boot-blink {
        0%,
        49% {
          opacity: 1;
        }
        50%,
        100% {
          opacity: 0;
        }
      }
    </style>
    <noscript><style>#boot { display: none; }</style></noscript>
